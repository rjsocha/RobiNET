# The demo hub. Everything here is fixed on purpose, so a connector's endpoint
# and a tenant's join line are constants that need no editing.
#
# Nothing generated means nothing secret: the only thing prepare.sh creates is
# the binder's ssh key, which is the one piece that must not be committed.

public:
  # What connectors dial, and the address in compose.yml. No port: each
  # instance gets its own.
  endpoint: 250.250.250.250

  bind: 0.0.0.0

api:
  listen: ":8443"
  entrypoint: https

  # Empty, so the hub signs its own certificate at startup and clients pass
  # --insecure. A real hub either gets a certificate here or sits behind
  # something that has one, with entrypoint: http.
  tls:
    cert: ""
    key: ""

state:
  path: /var/lib/robinet/hub.json

# One entry per family, each a superprefix plus the size handed to one
# instance. The IPv6 pool is a unique local prefix, which on a real hub is
# generated so that two hubs never share one - here it is written down because
# a demo that generates it could not have a constant anywhere else.
overlays:
  - 198.19.0.0/16/24
  - fd42:6f62:696e::/48/112

# Ten instances is a demo.
ports: 20000-20009

mtu: 1500

relay: true

security:
  # Known to whoever may create an instance here, and never transmitted: it
  # goes into a signed bootstrap message. Fixed for the demo, generated by
  # robinet hub init for anything else.
  token: demo

# Binders live one file per operator in the binder directory, written by
# prepare.sh from the key it generates.
